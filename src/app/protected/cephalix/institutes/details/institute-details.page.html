<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="all">
      <ion-icon name="caret-back"></ion-icon>
      @if(!authService.isMD()){<ion-label>{{ 'All institutes' | translate}}</ion-label>}
    </ion-tab-button>

    <ion-tab-button tab="edit">
      <ion-icon name="build-sharp"></ion-icon>
      @if(!authService.isMD()){<ion-label>{{ 'edit' | translate}}</ion-label>}
    </ion-tab-button>

    <ion-tab-button tab="status">
      <ion-icon name="stats-chart"></ion-icon>
      @if(!authService.isMD()){<ion-label>{{ 'Status' | translate}}</ion-label>}
    </ion-tab-button>

    <ion-tab-button tab="synced-objects">
      <ion-icon name="code-working"></ion-icon>
      @if(!authService.isMD()){<ion-label>{{ 'synced objects' | translate}}</ion-label>}
    </ion-tab-button>
    
  </ion-tab-bar>
</ion-tabs>
