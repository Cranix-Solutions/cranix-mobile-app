<ion-tabs>

      <ion-icon name="mail"></ion-icon>
      <ion-label *ngIf="!authService.isMD()">{{ 'Inbox' | translate }}</ion-label>

      <ion-icon name="create"></ion-icon>

  </ion-tab-bar>
</ion-tabs>
