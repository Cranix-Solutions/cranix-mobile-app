<cranix-toolbar title="{{'Compose mail' | translate}}"></cranix-toolbar>
<ion-content>
  <ion-list>
    <ion-item>
      <ion-label position="stacked">{{ 'To' | translate }} *</ion-label>
      <ion-input type="text" [(ngModel)]="to" placeholder="{{'mail@example.com' | translate}}"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">CC</ion-label>
      <ion-input type="text" [(ngModel)]="cc"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">BCC</ion-label>
      <ion-input type="text" [(ngModel)]="bcc"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">{{ 'Subject' | translate }}</ion-label>
      <ion-input type="text" [(ngModel)]="subject"></ion-input>
    </ion-item>
    <div class="mail-compose-body">
      <div class="mail-compose-label">{{ 'Message' | translate }}</div>
      <quill-editor [(ngModel)]="body" [styles]="{height: '300px'}"
        placeholder="{{ 'Write your message ...' | translate }}">
      </quill-editor>
    </div>
    <ion-item>
      <ion-label position="stacked">{{ 'Attachments' | translate }}</ion-label>
      <input type="file" multiple (change)="onFilesAdded($event)">
    </ion-item>
  </ion-list>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" (click)="send()" [disabled]="sending || !to">
        <ion-icon slot="start" name="send"></ion-icon>
        {{ 'Send' | translate }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  @if(sending){
  <ion-progress-bar type="indeterminate"></ion-progress-bar>
  }
</ion-content>
